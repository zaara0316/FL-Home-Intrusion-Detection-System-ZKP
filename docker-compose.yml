    depends_on:

      - fl-server

    networks:

      - fednatd-net


  # ==========================================================
  # DATASET DOWNLOADER
  # ==========================================================

  dataset-downloader:

    build: .

    profiles:

      - download

    environment:

      KAGGLE_CONFIG_DIR: /root/.kaggle

    volumes:

      - type: bind

        source: C:/Users/zaara/.kaggle/access_token

        target: /root/.kaggle/access_token

        read_only: true

        bind:

          create_host_path: false

      - nbaiot-data:/dataset

    command:

      - kaggle

      - datasets

      - download

      - -d

      - mkashifn/nbaiot-dataset

      - -p

      - /dataset

      - --unzip


  # ==========================================================
  # PREPROCESSING
  # ==========================================================

  preprocess:

    build: .

    profiles:

      - preprocessing

    volumes:

      - nbaiot-data:/dataset

      - ./:/app

    working_dir: /app

    command:

      - python

      - -u

      - preprocess.py


# ============================================================
# NETWORKS AND VOLUMES
# ============================================================

networks:

  fednatd-net:

    driver: bridge


volumes:

  nbaiot-data: