services:

  # ==========================================================
  # FEDERATED SERVER
  # ==========================================================

  fl-server:

    build: .

    command: ["python", "-u", "server.py"]

    environment:

      SERVER_HOST: "0.0.0.0"

      SERVER_PORT: "8000"

      MODEL_FEATURES: "115"

    ports:

      - "8000:8000"

    volumes:

      - ./artifacts:/app/artifacts

      - ./logs:/app/logs

    networks:

      - fednatd-net


  # ==========================================================
  # HOME 1
  # ==========================================================

  home-1:

    build: .

    command: ["python", "-u", "home.py"]

    environment:

      HOME_ID: "home-1"

      DEVICE_ID: "1"

      DATASET_PATH: "/data/train.csv"

      FEATURE_SCHEMA_PATH: "/app/artifacts/feature_columns.json"

      FL_SERVER_URL: "http://fl-server:8000"

      TRAIN_ROUNDS: "5"

      LOCAL_EPOCHS: "3"

      LEARNING_RATE: "0.01"

    volumes:

      - ./dataset/partitions/home-1-train.csv:/data/train.csv:ro

      - ./artifacts:/app/artifacts

      - ./logs:/app/logs

    depends_on:

      - fl-server

    networks:

      - fednatd-net


  # ==========================================================
  # HOME 2
  # ==========================================================

